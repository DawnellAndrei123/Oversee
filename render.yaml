services:
  - type: web
    name: oversee-constructions
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: OVERSEE_EMAIL_FROM
        sync: false
      - key: OTP_TTL_MINUTES
        value: 10
      - key: SESSION_TTL_DAYS
        value: 30
